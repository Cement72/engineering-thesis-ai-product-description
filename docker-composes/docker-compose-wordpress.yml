version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: wp_db
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: adam
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    container_name: wp_site
    depends_on:
      - db
    ports:
      - "8080:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: adam
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_DB_NAME: wordpress

    volumes:
      - wp_data:/var/www/html

  ngrok:
    image: ngrok/ngrok:latest
    container_name: wp_ngrok
    restart: always
    depends_on:
      - wordpress
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: 3CfoEpdQJsnuywO5inGMZSsAGVv_7hJ4X17AWRdU1hVAW65y3 # TUTAJ NALEŻY WKLEIĆ SWÓJ TOKEN AUTORYZACYJNY NGROK
    command:
      - "http"
      - "wordpress:80"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wp_pma
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: password

volumes:
  db_data:
  wp_data: